<!-- 낙서/그래피티 스타일 커스텀 (Chirpy metadata-hook) : 검정 + 노랑 + 하늘색 포인트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root, html[data-mode] {
    --yellow: #ffd23f;
    --yellow-soft: rgba(255, 210, 63, 0.35);
    --sky: #2de2e6;
    --ink: #0b0b0b;
    --main-bg: #0f0f0f !important;
    --topbar-bg: rgba(15, 15, 15, 0.94) !important;
    --sidebar-bg: #050505 !important;
    --card-bg: #181818 !important;
    --text-color: #ececec !important;
    --heading-color: #ffffff !important;
    --link-color: var(--sky) !important;
    --link-underline-color: var(--sky) !important;
  }

  /* 모드 전환 버튼 숨김: 테마 고정 */
  #mode-toggle { display: none !important; }

  /* 배경: 검은 벽 + 노란 페인트 자국 */
  body {
    background-color: #0f0f0f;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255, 210, 63, 0.10) 0 6px, transparent 7px),
      radial-gradient(circle at 78% 64%, rgba(255, 210, 63, 0.07) 0 9px, transparent 10px),
      radial-gradient(circle at 46% 88%, rgba(45, 226, 230, 0.06) 0 5px, transparent 6px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 38px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 76px);
    background-attachment: fixed;
  }

  /* 본문: 손글씨 */
  body, .content, .card-text, #post-list, #toc, .post-meta, #breadcrumb {
    font-family: 'Gaegu', 'Nanum Pen Script', cursive, sans-serif !important;
    font-size: 1.12rem;
  }

  /* 제목: 영문 Caveat + 한글 펜 손글씨 */
  h1, h2, h3, h4, h5, h6, .card-title, .post-title, .panel-heading {
    font-family: 'Caveat', 'Nanum Pen Script', cursive !important;
    font-weight: 600 !important;
    letter-spacing: 0.01em;
    color: var(--heading-color);
    text-shadow: none !important;
  }
  h1, .post-title { font-size: 2.6rem !important; }

  /* 홈 글 목록 제목: 본문과 같은 Gaegu */
  #post-list .card-title {
    font-family: 'Gaegu', 'Nanum Pen Script', cursive !important;
    font-weight: 700 !important;
    font-size: 1.9rem !important;
  }

  /* 코드는 고정폭 유지 */
  code, pre, kbd, samp, .highlight, .highlight * {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace !important;
    font-size: 0.9rem !important;
  }

  /* 사이드바 */
  #avatar:empty { display: none !important; }
  #sidebar {
    background-image:
      radial-gradient(circle at 20% 85%, rgba(255, 210, 63, 0.16) 0 14px, transparent 15px),
      radial-gradient(circle at 70% 92%, rgba(255, 210, 63, 0.10) 0 4px, transparent 5px),
      radial-gradient(circle at 85% 10%, rgba(45, 226, 230, 0.10) 0 10px, transparent 11px);
    border-right: 3px dashed rgba(255, 210, 63, 0.18);
  }
  #sidebar .profile-wrapper { margin-top: 2.5rem; }
  /* 프로필 그림: 원형 자르기 없이 그대로 */
  #sidebar #avatar {
    width: 8.5rem !important;
    height: 8.5rem !important;
    border: none !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    overflow: visible !important;
  }
  #sidebar #avatar img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    border-radius: 0 !important;
    transform: rotate(-4deg);
    transition: transform 0.2s ease;
    /* 검은 배경에서도 보이도록 흰 스티커 테두리 */
    filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(3px 4px 0 rgba(255, 210, 63, 0.55));
  }
  #sidebar #avatar:hover img { transform: rotate(3deg) scale(1.05); }
  #sidebar .site-title {
    font-family: 'Gaegu', cursive !important;
    font-weight: 700 !important;
    font-size: 1.9rem !important;
    line-height: 1.1;
    color: #ffffff !important;
    -webkit-text-stroke: 0.6px #ffffff;
    text-shadow: none !important;
    white-space: normal;
    word-break: keep-all;
    transform: rotate(-2deg);
    display: inline-block;
  }
  #sidebar .site-subtitle {
    font-family: 'Gaegu', cursive !important;
    font-style: normal !important;
    font-size: 1.05rem !important;
    color: var(--yellow) !important;
    word-break: keep-all;
    transform: rotate(2deg);
  }
  #sidebar .nav-link { display: flex; align-items: center; }
  #sidebar .nav-link span {
    font-family: 'Nanum Pen Script', 'Caveat', cursive !important;
    font-size: 1.55rem !important;
    letter-spacing: 0.04em !important;
    text-transform: none !important;
  }
  #sidebar .nav-item.active .nav-link,
  #sidebar .nav-link:hover {
    color: var(--yellow) !important;
    text-shadow: none !important;
  }
  #sidebar .nav-item.active .nav-link { background: rgba(255, 210, 63, 0.10) !important; }
  #topbar #breadcrumb, #topbar-title {
    font-family: 'Nanum Pen Script', cursive !important;
    font-size: 1.5rem !important;
  }

  /* 글 목록 카드: 벽에 붙인 종이 + 노란 테이프 */
  #post-list .card-wrapper {
    position: relative;
    border: 2px solid rgba(255, 210, 63, 0.25) !important;
    border-radius: 4px !important;
    box-shadow: 6px 6px 0 #000;
    transform: rotate(-0.6deg);
    transition: transform 0.15s ease;
    overflow: visible !important;
  }
  #post-list .card-wrapper:nth-child(even) { transform: rotate(0.6deg); }
  #post-list .card-wrapper:hover { transform: rotate(0deg) scale(1.01); border-color: var(--yellow) !important; }
  #post-list .card-wrapper::before {
    content: "";
    position: absolute;
    top: -10px; left: 50%;
    width: 90px; height: 22px;
    margin-left: -45px;
    background: rgba(255, 210, 63, 0.75);
    transform: rotate(-3deg);
    z-index: 2;
  }

  /* 본문 소제목: 노란 형광펜 */
  .content h2 {
    display: inline-block;
    padding: 0 0.3em;
    background: linear-gradient(transparent 58%, var(--yellow-soft) 58%);
  }
  .content h3 { color: var(--yellow) !important; }

  /* 링크: 하늘색 물결 밑줄 */
  .content a:not(.img-link) {
    text-decoration: underline wavy var(--sky) !important;
    text-underline-offset: 4px;
  }

  /* 카테고리 페이지: 스티커 벽 */
  .tag-wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1.6rem;
    margin-top: 1.5rem;
  }
  .tag-sticker {
    position: relative;
    padding: 1.1rem 1.2rem 1rem;
    background: #181818;
    border: 3px solid var(--sticker-color, var(--yellow));
    border-radius: 14px 4px 16px 6px;
    box-shadow: 5px 5px 0 #000;
    transform: rotate(var(--tilt, -1deg));
  }
  .tag-sticker:hover { transform: rotate(0deg) scale(1.02); }
  .sticker-1 { --sticker-color: var(--yellow); --tilt: -1.5deg; }
  .sticker-2 { --sticker-color: var(--yellow); --tilt: 1.2deg; }
  .sticker-3 { --sticker-color: var(--yellow); --tilt: -0.8deg; }
  .sticker-4 { --sticker-color: var(--yellow); --tilt: 1.6deg; }
  .sticker-5 { --sticker-color: var(--yellow); --tilt: -1.2deg; }
  .sticker-6 { --sticker-color: var(--yellow); --tilt: 0.9deg; }
  .content .tag-sticker h2.sticker-title {
    background: none;
    padding: 0;
    margin: 0 0 0.3rem;
    font-size: 1.5rem !important;
    color: var(--sticker-color) !important;
  }
  .sticker-count {
    display: inline-block;
    min-width: 1.8em;
    margin-left: 0.3em;
    padding: 0 0.4em;
    border-radius: 999px;
    background: var(--sticker-color);
    color: var(--ink);
    font-size: 1rem;
    text-align: center;
    transform: rotate(8deg);
  }
  .sticker-desc { margin-bottom: 0.5rem; opacity: 0.85; }
  .sticker-posts { padding-left: 1.1rem; margin: 0; }
  .content .sticker-posts a { color: #ffffff !important; text-decoration: none !important; border-bottom: none !important; }
  .sticker-posts small { opacity: 0.6; }
  /* 카테고리 글 목록: 제목은 그대로 흐르고, 날짜만 마지막 줄 오른쪽 끝에 */
  .tag-sticker .sticker-posts { padding-left: 1.1rem; }
  .tag-sticker .sticker-posts li { display: list-item; margin-bottom: 0.35rem; }
  .tag-sticker .sticker-posts li::after { content: ""; display: block; clear: both; }
  .tag-sticker .sticker-posts .leader { display: none; }
  .tag-sticker .sticker-posts small {
    float: right;
    margin-left: 0.6rem;
    white-space: nowrap;
  }
  .sticker-empty { margin: 0; opacity: 0.6; font-style: italic; }
  /* 검색 결과: 홈 글 목록과 같은 글씨, 형광펜·밑줄 없음 */
  #search-results h2,
  #search-results h2 a {
    font-family: 'Gaegu', 'Nanum Pen Script', cursive !important;
    font-weight: 700 !important;
    font-size: 1.6rem !important;
    color: #ffffff !important;
    background: none !important;
    padding: 0 !important;
    display: block;
    text-decoration: none !important;
    border-bottom: none !important;
  }
  #search-results h2 a:hover { color: var(--yellow) !important; }
  #search-results, #search-input {
    font-family: 'Gaegu', 'Nanum Pen Script', cursive !important;
  }
  /* 검색창 비밀 링크 카드 */
  .secret-card {
    margin: 0.5rem 0 1.5rem;
    padding: 1.2rem;
    max-width: 380px;
    background: #181818;
    border: 3px solid var(--yellow);
    border-radius: 14px 4px 16px 6px;
    box-shadow: 5px 5px 0 #000;
    transform: rotate(-1deg);
    text-align: center;
  }
  .secret-head {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--yellow);
    margin-bottom: 0.8rem;
  }
  .secret-qr-wrap {
    display: inline-block;
    background: #fff;
    border-radius: 12px;
    padding: 0.4rem 0.4rem 0.8rem;
  }
  .secret-qr { display: block; max-width: 100%; height: auto !important; }
  .secret-name {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: #2a9de6;
  }
  .secret-btn {
    display: inline-block;
    margin-top: 0.9rem;
    padding: 0.35rem 1rem;
    border-radius: 999px;
    background: var(--yellow);
    color: #111 !important;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    text-decoration: none !important;
  }
  .secret-btn:hover { filter: brightness(1.1); }
  /* 비밀 카드가 뜨면 "검색 결과가 없습니다" 문구 숨김 */
  #search-results:has(.secret-card) > p { display: none !important; }
  /* 비밀 카드 글씨 통일 (본문 Gaegu), 버튼 밑줄 제거 */
  #search-results .secret-card,
  #search-results .secret-card * {
    font-family: 'Gaegu', 'Nanum Pen Script', cursive !important;
  }
  #search-results .secret-card .secret-btn {
    font-size: 1.25rem !important;
    font-weight: 700 !important;
    color: #111 !important;
    text-decoration: none !important;
    border-bottom: none !important;
  }
  /* ===== 굵은 글씨 없애기: 모든 글자를 본문과 같은 Gaegu 보통 굵기로 ===== */
  body, h1, h2, h3, h4, h5, h6,
  .card-title, .post-title, .panel-heading,
  #sidebar .site-title, #sidebar .site-subtitle, #sidebar .nav-link, #sidebar .nav-link span,
  #topbar #breadcrumb, #topbar-title,
  #post-list .card-title, #search-results, #search-results h2, #search-results h2 a, #search-input,
  .tag-sticker .sticker-title, .sticker-count,
  #search-results .secret-card, #search-results .secret-card *,
  .secret-head, .secret-name, .secret-btn, #search-results .secret-card .secret-btn,
  strong, b, th {
    font-family: 'Gaegu', 'Nanum Pen Script', cursive !important;
    font-weight: 400 !important;
    -webkit-text-stroke: 0 !important;
  }
  /* 굵게 표시하던 강조는 노란색으로 구분 */
  .content strong, .content b { color: var(--yellow); }
  /* ===== 본문 가독성: 긴 글은 읽기 쉬운 둥근 고딕(Gowun Dodum), 제목·메뉴는 손글씨(Gaegu) 유지 ===== */
  .content, .content p, .content li, .content td, .content th,
  .content strong, .content b, .content blockquote,
  .card-text, .sticker-desc, .sticker-empty, #search-results p {
    font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif !important;
    font-weight: 400 !important;
  }
  .content { font-size: 1rem !important; line-height: 1.85 !important; letter-spacing: -0.005em; }
  .card-text { font-size: 0.95rem !important; line-height: 1.7 !important; }
</style>
<script defer src="/assets/js/secret-search.js"></script>
